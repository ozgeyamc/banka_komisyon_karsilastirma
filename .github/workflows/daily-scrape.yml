name: Günlük Komisyon Karşılaştırma

on:
  schedule:
    - cron: "00 05 * * *"
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Test maili gönder"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scrape-and-compare:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu checkout et
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium kur
        run: playwright install --with-deps chromium

      - name: Eski Excel'i yedekle
        run: |
          if [ -f komisyon_karsilastirma.xlsx ]; then
            cp komisyon_karsilastirma.xlsx komisyon_karsilastirma_eski.xlsx
          fi

      - name: Debug - Kategori adlarını göster
        run: |
          python -c "
import sys
from scraper_garanti   import scrape_garanti_bbva
from scraper_isbank    import scrape_isbank
from scraper_akbank    import scrape_akbank
from scraper_yapikredi import scrape_yapikredi

bankalar = {
    'GARANTİ':   scrape_garanti_bbva,
    'İŞBANKASI': scrape_isbank,
    'AKBANK':    scrape_akbank,
    'YAPIKREDI': scrape_yapikredi,
}
for banka, fn in bankalar.items():
    print(f'\n=== {banka} ===')
    try:
        satirlar = fn()
        kategoriler = {}
        for s in satirlar:
            kategoriler.setdefault(s.kategori, []).append(s.masraf)
        for kat, masraflar in list(kategoriler.items())[:20]:
            print(f'  [{kat}]')
            for m in masraflar[:4]:
                print(f'    - {m}')
    except Exception as e:
        print(f'  HATA: {e}')
"

      - name: Scraper'ları çalıştır ve Excel üret
        run: python main.py

      - name: Değişiklik kontrolü ve mail bildirimi
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: |
          TEST_MODE="${{ github.event.inputs.test_mail }}"
          if [ "$TEST_MODE" = "true" ]; then
            python -c "
from notify import check_and_notify
check_and_notify('komisyon_karsilastirma_eski.xlsx', 'komisyon_karsilastirma.xlsx', test_mode=True)
"
          elif [ -f komisyon_karsilastirma_eski.xlsx ]; then
            python -c "
from notify import check_and_notify
check_and_notify('komisyon_karsilastirma_eski.xlsx', 'komisyon_karsilastirma.xlsx')
"
          else
            echo "[notify] İlk çalışma, karşılaştırma yapılmadı."
          fi

      - name: Excel'i artifact olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: komisyon-karsilastirma
          path: komisyon_karsilastirma.xlsx
          retention-days: 30

      - name: Değişiklik var mı kontrol et
        id: git_check
        run: |
          if [ -n "$(git status --porcelain komisyon_karsilastirma.xlsx)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Excel'i commit et ve push et
        if: steps.git_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add komisyon_karsilastirma.xlsx
          git commit -m "Komisyon karşılaştırma güncellendi ($(TZ='Europe/Istanbul' date +'%d.%m.%Y %H:%M'))"
          git push
